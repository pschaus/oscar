name: Test and Coverage

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        maven: ['3.8.5']
        java: ['21']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ matrix.java }}-

      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: ${{ matrix.java }}
          maven-version: ${{ matrix.maven }}

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Generate test coverage
        id: coverage
        run: |
          echo "compiling"
          mvn compile
          echo "testing"
          mvn test
          echo "jacoco reporting"
          mvn jacoco:report
          echo "extract coverage value"
          
          # Ensure the JaCoCo report file exists before processing
          if [ -f target/site/jacoco/index.html ]; then
            COVERAGE=$(sed -nE 's/.*<td>Total<\/td><td class="bar">[^<]+<\/td><td class="ctr2">([0-9]+)%<\/td>.*/\1/p' target/site/jacoco/index.html)
            echo "display=$COVERAGE%" >> $GITHUB_ENV    # with "%"
            echo "coverage=$COVERAGE" >> $GITHUB_ENV    # without "%"
          else
            echo "Jacoco report not found, setting coverage to 0"
            echo "display=0%" >> $GITHUB_ENV
            echo "coverage=0" >> $GITHUB_ENV
          fi

      - name: Save coverage report to tmp
        run: |
          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco /tmp/coverage
          else
            mkdir -p /tmp/coverage
            echo "<html><body>No coverage report generated.</body></html>" > /tmp/coverage/index.html
          fi

      - name: Generate the badge SVG using Shields.io
        run: |
          COVERAGE="${{ env.coverage }}"
          echo "Extracted Coverage: $COVERAGE"
          
          if [[ ! "$COVERAGE" =~ ^[0-9]+$ ]]; then
            echo "Error: COVERAGE is not a valid number ('$COVERAGE'). Defaulting to 0."
            COVERAGE="0"
          fi
          
          if [ "$COVERAGE" -gt 90 ]; then COLOR="green"
          elif [ "$COVERAGE" -gt 80 ]; then COLOR="yellowgreen"
          elif [ "$COVERAGE" -gt 70 ]; then COLOR="yellow"
          elif [ "$COVERAGE" -gt 60 ]; then COLOR="orange"
          else COLOR="red"
          fi
          
          echo "Final Coverage: $COVERAGE%"
          echo "Badge Color: $COLOR"
          
          curl -o /tmp/coverbadge.svg \
            "https://img.shields.io/badge/Test%20Coverage-$COVERAGE%25-$COLOR.svg"

      - name: Prepare gh-pages site
        run: |
          mkdir -p gh-pages-site/badges
          mv /tmp/coverbadge.svg gh-pages-site/badges/coverbadge.svg
          cp -r /tmp/coverage gh-pages-site/coverage
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=coverage/index.html"></head><body>Redirecting to <a href="coverage/index.html">Coverage Report</a></body></html>' > gh-pages-site/index.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages-site
          branch: gh-pages
